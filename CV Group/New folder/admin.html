<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chopvibe Admin | Scouting</title>
    <style>
        :root { --red: #FF0000; --dark: #0B0B0B; --card: #161616; --text: #888; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 250px; height: 100vh; background: #000; padding: 30px; border-right: 1px solid #222; }
        .nav-item { padding: 15px 0; color: var(--text); cursor: pointer; font-weight: 600; list-style: none; }
        .nav-item.active { color: var(--red); }

        /* Main Content */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Talent Table */
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; }
        th { text-align: left; padding: 20px; color: var(--text); border-bottom: 1px solid #222; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 20px; border-bottom: 1px solid #222; }
        
        /* Status Badges */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
        .badge-pending { background: #332b00; color: #ffcc00; }
        
        .action-btn { background: var(--red); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--red); margin-bottom:40px;">CHOPVIBE</h2>
        <ul>
            <li class="nav-item active">Talent Scouting</li>
            <li class="nav-item">Chopvibe Fest Tickets</li>
            <li class="nav-item">Studio Bookings</li>
            <li class="nav-item">Settings</li>
        </ul>
    </div>

    <div class="main">
        <div class="header-flex">
            <h1>Artist Roster Submissions</h1>
            <div>Total: <span style="color:var(--red)">42 Pending</span></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Artist Name</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Demo</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Zino Burna</strong></td>
                    <td>Owo, Akure</td>
                    <td><span class="badge badge-pending">PENDING</span></td>
                    <td><a href="#" style="color:var(--red)">Listen Now</a></td>
                    <td><button class="action-btn" onclick="openWhatsApp('23480...')">Contact</button></td>
                </tr>
                <!-- More rows will be injected by your Node.js backend -->
            </tbody>
        </table>
    </div>

    <script>
        function openWhatsApp(number) {
            window.open(`https://wa.me/${number}?text=Hello from Chopvibe Group! We heard your demo...`, '_blank');
        }
    </script>
</body>
</html>
